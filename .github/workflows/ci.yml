name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:


env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Setup cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        rust: [ stable, nightly ]
        include:
        - os: ubuntu-latest
          rust: stable
          features: '--all-features'
        - os: ubuntu-latest
          rust: stable
          features: '--no-default-features'
        - os: ubuntu-latest
          rust: stable
          features: '--features packages,ureq'
        - os: ubuntu-latest
          rust: stable
          features: '--features packages,reqwest'
        - os: ubuntu-latest
          rust: stable
          features: '--features typst-kit-fonts,typst-kit-embed-fonts'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Setup cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        key: ${{ matrix.features }}

    - name: Run tests
      run: cargo test ${{ matrix.features }}

    - name: Run doc tests
      run: cargo test --doc ${{ matrix.features }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: Build all features
      run: cargo build --all-features --verbose

    - name: Build no default features
      run: cargo build --no-default-features --verbose

  examples:
    name: Examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
        - name: small_example
          features: ''
        - name: resolve_static
          features: ''
        - name: resolve_packages
          features: 'packages,ureq'
        - name: font_searcher
          features: 'typst-kit-fonts,typst-kit-embed-fonts'
        - name: html
          features: 'typst-html'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        key: example-${{ matrix.example.name }}

    - name: Build example
      run: |
        if [ -z "${{ matrix.example.features }}" ]; then
          cargo build --example ${{ matrix.example.name }}
        else
          cargo build --example ${{ matrix.example.name }} --features ${{ matrix.example.features }}
        fi

  minimal-versions:
    name: Check minimal versions
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Rust nightly
      uses: dtolnay/rust-toolchain@nightly

    - name: Setup cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        key: minimal-versions

    - name: Check with minimal versions
      run: cargo +nightly check -Z minimal-versions --all-features

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ format, clippy, test, build, examples, minimal-versions ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Verify tag matches crate version
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
        if [ "$tag" != "$version" ]; then
          echo "ERROR: tag $tag does not match crate version $version — forgotten bump?" >&2
          exit 1
        fi

    - name: Skip if version already published
      run: |
        version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
        if curl -sf "https://crates.io/api/v1/crates/typst-as-lib" | jq -e --arg v "$version" '.versions[] | select(.num == $v)' > /dev/null; then
          echo "typst-as-lib $version is already published on crates.io — skipping"
          echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
        fi

    - name: Publish
      if: env.SKIP_PUBLISH != '1'
      run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
